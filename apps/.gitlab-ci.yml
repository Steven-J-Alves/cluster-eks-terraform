# Deploy order: cluster → lbc → externaldns → apps (apply all addons first)
# Branches: main → prod | staging → staging
# Runner: vps-native-runner (tags: [docker]) — shell executor with Docker socket, uses docker run for terraform

variables:
  TF_IMAGE: "hashicorp/terraform:1.9"
  REPO_HOST_DIR: "$CI_PROJECT_DIR"
  APPS_TF_WORKDIR: "/workspace/apps/apps_main"

stages:
  - validate
  - plan
  - apply
  - destroy

# ── Job templates (hidden) ─────────────────────────────────────────────────────

.apps_validate:
  stage: validate
  tags: [docker]
  script:
    - if ! aws s3 ls "s3://kk-eks-lab-tfstate/$CLUSTER_STATE_KEY" --region us-east-1 > /dev/null 2>&1; then
        echo "ERROR - Cluster state not found at $CLUSTER_STATE_KEY. Run cluster:apply first."; exit 1;
      fi
    - docker run --rm --user "$(id -u):$(id -g)"
        -v "$REPO_HOST_DIR:/workspace" -w $APPS_TF_WORKDIR
        -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY -e AWS_DEFAULT_REGION
        $TF_IMAGE init -input=false -reconfigure
        -backend-config="key=$TF_STATE_KEY"
    - docker run --rm --user "$(id -u):$(id -g)"
        -v "$REPO_HOST_DIR:/workspace" -w $APPS_TF_WORKDIR
        $TF_IMAGE validate

.apps_plan:
  stage: plan
  tags: [docker]
  script:
    - docker run --rm --user "$(id -u):$(id -g)"
        -v "$REPO_HOST_DIR:/workspace" -w $APPS_TF_WORKDIR
        -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY -e AWS_DEFAULT_REGION
        $TF_IMAGE init -input=false -reconfigure
        -backend-config="key=$TF_STATE_KEY"
    - docker run --rm --user "$(id -u):$(id -g)"
        -v "$REPO_HOST_DIR:/workspace" -w $APPS_TF_WORKDIR
        -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY -e AWS_DEFAULT_REGION
        $TF_IMAGE plan -input=false
        -var-file="$TF_VAR_FILE"
        -var="cluster_state_key=$CLUSTER_STATE_KEY" -out=tfplan

.apps_apply:
  stage: apply
  tags: [docker]
  script:
    - docker run --rm --user "$(id -u):$(id -g)"
        -v "$REPO_HOST_DIR:/workspace" -w $APPS_TF_WORKDIR
        -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY -e AWS_DEFAULT_REGION
        $TF_IMAGE init -input=false -reconfigure
        -backend-config="key=$TF_STATE_KEY"
    - docker run --rm --user "$(id -u):$(id -g)"
        -v "$REPO_HOST_DIR:/workspace" -w $APPS_TF_WORKDIR
        -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY -e AWS_DEFAULT_REGION
        $TF_IMAGE apply -input=false
        -var-file="$TF_VAR_FILE"
        -var="cluster_state_key=$CLUSTER_STATE_KEY" -auto-approve
  when: manual
  allow_failure: false

.apps_destroy:
  stage: destroy
  tags: [docker]
  script:
    - docker run --rm --user "$(id -u):$(id -g)"
        -v "$REPO_HOST_DIR:/workspace" -w $APPS_TF_WORKDIR
        -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY -e AWS_DEFAULT_REGION
        $TF_IMAGE init -input=false -reconfigure
        -backend-config="key=$TF_STATE_KEY"
    - docker run --rm --user "$(id -u):$(id -g)"
        -v "$REPO_HOST_DIR:/workspace" -w $APPS_TF_WORKDIR
        -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY -e AWS_DEFAULT_REGION
        $TF_IMAGE destroy -input=false
        -var-file="$TF_VAR_FILE"
        -var="cluster_state_key=$CLUSTER_STATE_KEY" -auto-approve
  when: manual

# ── PROD — main branch ─────────────────────────────────────────────────────────

apps:validate:
  extends: .apps_validate
  variables:
    TF_STATE_KEY: "prod/apps/terraform.tfstate"
    CLUSTER_STATE_KEY: "prod/cluster/terraform.tfstate"
    TF_VAR_FILE: "../environments/prod/terraform.tfvars"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"'
      changes:
        - apps/**/*

apps:plan:
  extends: .apps_plan
  variables:
    TF_STATE_KEY: "prod/apps/terraform.tfstate"
    CLUSTER_STATE_KEY: "prod/cluster/terraform.tfstate"
    TF_VAR_FILE: "../environments/prod/terraform.tfvars"
  artifacts:
    paths:
      - apps/apps_main/tfplan
    expire_in: 1 day
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"'
      changes:
        - apps/**/*
  needs:
    - apps:validate

apps:apply:
  extends: .apps_apply
  variables:
    TF_STATE_KEY: "prod/apps/terraform.tfstate"
    CLUSTER_STATE_KEY: "prod/cluster/terraform.tfstate"
    TF_VAR_FILE: "../environments/prod/terraform.tfvars"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"'
      changes:
        - apps/**/*
  needs:
    - apps:plan

apps:destroy:
  extends: .apps_destroy
  variables:
    TF_STATE_KEY: "prod/apps/terraform.tfstate"
    CLUSTER_STATE_KEY: "prod/cluster/terraform.tfstate"
    TF_VAR_FILE: "../environments/prod/terraform.tfvars"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"'
      changes:
        - apps/**/*

# ── STAGING — staging branch ───────────────────────────────────────────────────

apps:staging:validate:
  extends: .apps_validate
  variables:
    TF_STATE_KEY: "staging/apps/terraform.tfstate"
    CLUSTER_STATE_KEY: "staging/cluster/terraform.tfstate"
    TF_VAR_FILE: "../environments/staging/terraform.tfvars"
  rules:
    - if: '$CI_COMMIT_BRANCH == "staging" && $CI_PIPELINE_SOURCE == "push"'
      changes:
        - apps/**/*

apps:staging:plan:
  extends: .apps_plan
  variables:
    TF_STATE_KEY: "staging/apps/terraform.tfstate"
    CLUSTER_STATE_KEY: "staging/cluster/terraform.tfstate"
    TF_VAR_FILE: "../environments/staging/terraform.tfvars"
  artifacts:
    paths:
      - apps/apps_main/tfplan
    expire_in: 1 day
  rules:
    - if: '$CI_COMMIT_BRANCH == "staging" && $CI_PIPELINE_SOURCE == "push"'
      changes:
        - apps/**/*
  needs:
    - apps:staging:validate

apps:staging:apply:
  extends: .apps_apply
  variables:
    TF_STATE_KEY: "staging/apps/terraform.tfstate"
    CLUSTER_STATE_KEY: "staging/cluster/terraform.tfstate"
    TF_VAR_FILE: "../environments/staging/terraform.tfvars"
  rules:
    - if: '$CI_COMMIT_BRANCH == "staging" && $CI_PIPELINE_SOURCE == "push"'
      changes:
        - apps/**/*
  needs:
    - apps:staging:plan

apps:staging:destroy:
  extends: .apps_destroy
  variables:
    TF_STATE_KEY: "staging/apps/terraform.tfstate"
    CLUSTER_STATE_KEY: "staging/cluster/terraform.tfstate"
    TF_VAR_FILE: "../environments/staging/terraform.tfvars"
  rules:
    - if: '$CI_COMMIT_BRANCH == "staging" && $CI_PIPELINE_SOURCE == "push"'
      changes:
        - apps/**/*

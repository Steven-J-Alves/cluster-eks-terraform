# Deploy order: cluster (apply first) → lbc → externaldns
# Branches: main → prod | staging → staging
# State keys: <env>/lbc/terraform.tfstate
# cluster_state_key: <env>/cluster/terraform.tfstate (passed as TF var)

variables:
  LBC_TF_DIR: "$CI_PROJECT_DIR/addons/lbc/lbc_main"

stages:
  - validate
  - plan
  - apply
  - destroy

# ── Job templates (hidden) ─────────────────────────────────────────────────────

.lbc_validate:
  stage: validate
  image: hashicorp/terraform:1.9
  script:
    - aws s3 ls "s3://kk-eks-lab-tfstate/$CLUSTER_STATE_KEY" --region us-east-1 > /dev/null 2>&1
        || { echo "ERROR - Cluster state not found at $CLUSTER_STATE_KEY. Run cluster:apply first."; exit 1; }
    - cd "$LBC_TF_DIR"
    - terraform init -input=false -reconfigure
        -backend-config="key=$TF_STATE_KEY"
    - terraform validate

.lbc_plan:
  stage: plan
  image: hashicorp/terraform:1.9
  script:
    - cd "$LBC_TF_DIR"
    - terraform init -input=false -reconfigure
        -backend-config="key=$TF_STATE_KEY"
    - terraform plan -input=false
        -var="cluster_state_key=$CLUSTER_STATE_KEY" -out=tfplan

.lbc_apply:
  stage: apply
  image: hashicorp/terraform:1.9
  script:
    - cd "$LBC_TF_DIR"
    - terraform init -input=false -reconfigure
        -backend-config="key=$TF_STATE_KEY"
    - terraform apply -input=false
        -var="cluster_state_key=$CLUSTER_STATE_KEY" -auto-approve
  when: manual
  allow_failure: false

.lbc_destroy:
  stage: destroy
  image: hashicorp/terraform:1.9
  script:
    - cd "$LBC_TF_DIR"
    - terraform init -input=false -reconfigure
        -backend-config="key=$TF_STATE_KEY"
    - terraform destroy -input=false
        -var="cluster_state_key=$CLUSTER_STATE_KEY" -auto-approve
  when: manual

# ── PROD — main branch ─────────────────────────────────────────────────────────

lbc:validate:
  extends: .lbc_validate
  variables:
    TF_STATE_KEY: "prod/lbc/terraform.tfstate"
    CLUSTER_STATE_KEY: "prod/cluster/terraform.tfstate"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"'
      changes:
        - addons/lbc/**/*
        - modules/irsa/**/*

lbc:plan:
  extends: .lbc_plan
  variables:
    TF_STATE_KEY: "prod/lbc/terraform.tfstate"
    CLUSTER_STATE_KEY: "prod/cluster/terraform.tfstate"
  artifacts:
    paths:
      - addons/lbc/lbc_main/tfplan
    expire_in: 1 day
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"'
      changes:
        - addons/lbc/**/*
        - modules/irsa/**/*
  needs:
    - lbc:validate

lbc:apply:
  extends: .lbc_apply
  variables:
    TF_STATE_KEY: "prod/lbc/terraform.tfstate"
    CLUSTER_STATE_KEY: "prod/cluster/terraform.tfstate"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"'
      changes:
        - addons/lbc/**/*
        - modules/irsa/**/*
  needs:
    - lbc:plan

lbc:destroy:
  extends: .lbc_destroy
  variables:
    TF_STATE_KEY: "prod/lbc/terraform.tfstate"
    CLUSTER_STATE_KEY: "prod/cluster/terraform.tfstate"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"'
      changes:
        - addons/lbc/**/*
        - modules/irsa/**/*

# ── STAGING — staging branch ───────────────────────────────────────────────────

lbc:staging:validate:
  extends: .lbc_validate
  variables:
    TF_STATE_KEY: "staging/lbc/terraform.tfstate"
    CLUSTER_STATE_KEY: "staging/cluster/terraform.tfstate"
  rules:
    - if: '$CI_COMMIT_BRANCH == "staging" && $CI_PIPELINE_SOURCE == "push"'
      changes:
        - addons/lbc/**/*
        - modules/irsa/**/*

lbc:staging:plan:
  extends: .lbc_plan
  variables:
    TF_STATE_KEY: "staging/lbc/terraform.tfstate"
    CLUSTER_STATE_KEY: "staging/cluster/terraform.tfstate"
  artifacts:
    paths:
      - addons/lbc/lbc_main/tfplan
    expire_in: 1 day
  rules:
    - if: '$CI_COMMIT_BRANCH == "staging" && $CI_PIPELINE_SOURCE == "push"'
      changes:
        - addons/lbc/**/*
        - modules/irsa/**/*
  needs:
    - lbc:staging:validate

lbc:staging:apply:
  extends: .lbc_apply
  variables:
    TF_STATE_KEY: "staging/lbc/terraform.tfstate"
    CLUSTER_STATE_KEY: "staging/cluster/terraform.tfstate"
  rules:
    - if: '$CI_COMMIT_BRANCH == "staging" && $CI_PIPELINE_SOURCE == "push"'
      changes:
        - addons/lbc/**/*
        - modules/irsa/**/*
  needs:
    - lbc:staging:plan

lbc:staging:destroy:
  extends: .lbc_destroy
  variables:
    TF_STATE_KEY: "staging/lbc/terraform.tfstate"
    CLUSTER_STATE_KEY: "staging/cluster/terraform.tfstate"
  rules:
    - if: '$CI_COMMIT_BRANCH == "staging" && $CI_PIPELINE_SOURCE == "push"'
      changes:
        - addons/lbc/**/*
        - modules/irsa/**/*

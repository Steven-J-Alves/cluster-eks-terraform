# Deploy order: cluster (apply first) → lbc → externaldns
# Branches: main → prod | staging → staging
# Runner: vps-native-runner (tags: [docker]) — shell executor with Docker socket, uses docker run for terraform

variables:
  TF_IMAGE: "hashicorp/terraform:1.9"
  REPO_HOST_DIR: "$CI_PROJECT_DIR"
  LBC_TF_WORKDIR: "/workspace/addons/lbc/lbc_main"

stages:
  - validate
  - plan
  - apply
  - destroy

# ── Job templates (hidden) ─────────────────────────────────────────────────────

.lbc_validate:
  stage: validate
  tags: [docker]
  script:
    - if ! aws s3 ls "s3://kk-eks-lab-tfstate/$CLUSTER_STATE_KEY" --region us-east-1 > /dev/null 2>&1; then
        echo "ERROR - Cluster state not found at $CLUSTER_STATE_KEY. Run cluster:apply first."; exit 1;
      fi
    - docker run --rm --user "$(id -u):$(id -g)"
        -v "$REPO_HOST_DIR:/workspace" -w $LBC_TF_WORKDIR
        -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY -e AWS_DEFAULT_REGION
        $TF_IMAGE init -input=false -reconfigure
        -backend-config="key=$TF_STATE_KEY"
    - docker run --rm --user "$(id -u):$(id -g)"
        -v "$REPO_HOST_DIR:/workspace" -w $LBC_TF_WORKDIR
        $TF_IMAGE validate

.lbc_plan:
  stage: plan
  tags: [docker]
  script:
    - docker run --rm --user "$(id -u):$(id -g)"
        -v "$REPO_HOST_DIR:/workspace" -w $LBC_TF_WORKDIR
        -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY -e AWS_DEFAULT_REGION
        $TF_IMAGE init -input=false -reconfigure
        -backend-config="key=$TF_STATE_KEY"
    - docker run --rm --user "$(id -u):$(id -g)"
        -v "$REPO_HOST_DIR:/workspace" -w $LBC_TF_WORKDIR
        -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY -e AWS_DEFAULT_REGION
        $TF_IMAGE plan -input=false
        -var="cluster_state_key=$CLUSTER_STATE_KEY" -out=tfplan

.lbc_apply:
  stage: apply
  tags: [docker]
  script:
    - docker run --rm --user "$(id -u):$(id -g)"
        -v "$REPO_HOST_DIR:/workspace" -w $LBC_TF_WORKDIR
        -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY -e AWS_DEFAULT_REGION
        $TF_IMAGE init -input=false -reconfigure
        -backend-config="key=$TF_STATE_KEY"
    - docker run --rm --user "$(id -u):$(id -g)"
        -v "$REPO_HOST_DIR:/workspace" -w $LBC_TF_WORKDIR
        -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY -e AWS_DEFAULT_REGION
        $TF_IMAGE apply -input=false
        -var="cluster_state_key=$CLUSTER_STATE_KEY" -auto-approve
  when: manual
  allow_failure: false

.lbc_destroy:
  stage: destroy
  tags: [docker]
  script:
    - docker run --rm --user "$(id -u):$(id -g)"
        -v "$REPO_HOST_DIR:/workspace" -w $LBC_TF_WORKDIR
        -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY -e AWS_DEFAULT_REGION
        $TF_IMAGE init -input=false -reconfigure
        -backend-config="key=$TF_STATE_KEY"
    - docker run --rm --user "$(id -u):$(id -g)"
        -v "$REPO_HOST_DIR:/workspace" -w $LBC_TF_WORKDIR
        -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY -e AWS_DEFAULT_REGION
        $TF_IMAGE destroy -input=false
        -var="cluster_state_key=$CLUSTER_STATE_KEY" -auto-approve
  when: manual

# ── PROD — main branch ─────────────────────────────────────────────────────────

lbc:validate:
  extends: .lbc_validate
  variables:
    TF_STATE_KEY: "prod/lbc/terraform.tfstate"
    CLUSTER_STATE_KEY: "prod/cluster/terraform.tfstate"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"'
      changes:
        - addons/lbc/**/*
        - modules/irsa/**/*

lbc:plan:
  extends: .lbc_plan
  variables:
    TF_STATE_KEY: "prod/lbc/terraform.tfstate"
    CLUSTER_STATE_KEY: "prod/cluster/terraform.tfstate"
  artifacts:
    paths:
      - addons/lbc/lbc_main/tfplan
    expire_in: 1 day
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"'
      changes:
        - addons/lbc/**/*
        - modules/irsa/**/*
  needs:
    - lbc:validate

lbc:apply:
  extends: .lbc_apply
  variables:
    TF_STATE_KEY: "prod/lbc/terraform.tfstate"
    CLUSTER_STATE_KEY: "prod/cluster/terraform.tfstate"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"'
      changes:
        - addons/lbc/**/*
        - modules/irsa/**/*
  needs:
    - lbc:plan

lbc:destroy:
  extends: .lbc_destroy
  variables:
    TF_STATE_KEY: "prod/lbc/terraform.tfstate"
    CLUSTER_STATE_KEY: "prod/cluster/terraform.tfstate"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"'
      changes:
        - addons/lbc/**/*
        - modules/irsa/**/*

# ── STAGING — staging branch ───────────────────────────────────────────────────

lbc:staging:validate:
  extends: .lbc_validate
  variables:
    TF_STATE_KEY: "staging/lbc/terraform.tfstate"
    CLUSTER_STATE_KEY: "staging/cluster/terraform.tfstate"
  rules:
    - if: '$CI_COMMIT_BRANCH == "staging" && $CI_PIPELINE_SOURCE == "push"'
      changes:
        - addons/lbc/**/*
        - modules/irsa/**/*

lbc:staging:plan:
  extends: .lbc_plan
  variables:
    TF_STATE_KEY: "staging/lbc/terraform.tfstate"
    CLUSTER_STATE_KEY: "staging/cluster/terraform.tfstate"
  artifacts:
    paths:
      - addons/lbc/lbc_main/tfplan
    expire_in: 1 day
  rules:
    - if: '$CI_COMMIT_BRANCH == "staging" && $CI_PIPELINE_SOURCE == "push"'
      changes:
        - addons/lbc/**/*
        - modules/irsa/**/*
  needs:
    - lbc:staging:validate

lbc:staging:apply:
  extends: .lbc_apply
  variables:
    TF_STATE_KEY: "staging/lbc/terraform.tfstate"
    CLUSTER_STATE_KEY: "staging/cluster/terraform.tfstate"
  rules:
    - if: '$CI_COMMIT_BRANCH == "staging" && $CI_PIPELINE_SOURCE == "push"'
      changes:
        - addons/lbc/**/*
        - modules/irsa/**/*
  needs:
    - lbc:staging:plan

lbc:staging:destroy:
  extends: .lbc_destroy
  variables:
    TF_STATE_KEY: "staging/lbc/terraform.tfstate"
    CLUSTER_STATE_KEY: "staging/cluster/terraform.tfstate"
  rules:
    - if: '$CI_COMMIT_BRANCH == "staging" && $CI_PIPELINE_SOURCE == "push"'
      changes:
        - addons/lbc/**/*
        - modules/irsa/**/*
